<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General File Viewer</title><style>body{margin:0;font-family:system-ui;background:#f3f4f6;color:#111827}.app{max-width:1000px;margin:auto;padding:24px}.drop{padding:55px;text-align:center;border:2px dashed #6366f1;border-radius:16px;background:#fff;cursor:pointer}button{padding:9px 13px;border:0;border-radius:7px;background:#4f46e5;color:#fff;cursor:pointer}.bar{display:none;gap:8px;flex-wrap:wrap;margin:14px 0}.bar.show{display:flex}pre{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:20px;border-radius:12px;overflow:auto;min-height:300px}input{display:none}.meta{color:#6b7280}</style></head><body><div class="app"><h1>General File Viewer</h1><div id="drop" class="drop">Drop a file here<br><small>or click to browse — local processing</small><input id="file" type="file"></div><div id="bar" class="bar"><button id="open">Open Viewer</button><button id="download">Download</button><button id="copy">Copy</button><button id="hash">SHA-256</button><button id="clear">Clear</button></div><p id="meta" class="meta"></p><pre id="out">No file loaded.</pre></div><script>const $=x=>document.getElementById(x);let f=null,u=null,text='';function load(x){if(!x)return;f=x;if(u)URL.revokeObjectURL(u);u=URL.createObjectURL(f);$('meta').textContent=`${f.name} · ${f.type||'unknown MIME'} · ${f.size.toLocaleString()} bytes`;f.text().then(t=>{text=t;$('out').textContent=t}).catch(()=>$('out').textContent='This appears to be a binary file. Use Download or Open Viewer if your browser supports its format.');$('bar').classList.add('show')}$('drop').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);$('download').onclick=()=>{if(!u)return;const a=document.createElement('a');a.href=u;a.download=f.name;a.click()};$('copy').onclick=()=>navigator.clipboard?.writeText(text);$('open').onclick=()=>{if(u)window.open(u,'_blank')};$('hash').onclick=async()=>{if(!f)return;const h=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());$('meta').textContent+=' · SHA-256: '+[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')};$('clear').onclick=()=>{if(u)URL.revokeObjectURL(u);f=null;u=null;text='';$('file').value='';$('meta').textContent='';$('out').textContent='No file loaded.';$('bar').classList.remove('show')};['dragover','dragenter'].forEach(x=>$('drop').addEventListener(x,e=>e.preventDefault()));$('drop').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])}</script></body></html>
