<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>General File Viewer</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .app {
            max-width: 1000px;
            margin: auto;
            padding: 24px;
        }

        .drop {
            padding: 55px;
            text-align: center;
            border: 2px dashed #6366f1;
            border-radius: 16px;
            background: #fff;
            cursor: pointer;
        }

        button {
            padding: 9px 13px;
            border: 0;
            border-radius: 7px;
            background: #4f46e5;
            color: #fff;
            cursor: pointer;
        }

        .bar {
            display: none;
            gap: 8px;
            flex-wrap: wrap;
            margin: 14px 0;
        }

        .bar.show {
            display: flex;
        }

        pre {
            white-space: pre-wrap;
            background: #111827;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 12px;
            overflow: auto;
            min-height: 300px;
        }

        input {
            display: none;
        }

        .meta {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>General File Viewer</h1>

        <div id="drop" class="drop">
            Drop a file here<br>
            <small>or click to browse — local processing</small>
            <input id="file" type="file">
        </div>

        <div id="bar" class="bar">
            <button id="open">Open Viewer</button>
            <button id="download">Download</button>
            <button id="copy">Copy</button>
            <button id="hash">SHA-256</button>
            <button id="clear">Clear</button>
        </div>

        <p id="meta" class="meta"></p>
        <pre id="out">No file loaded.</pre>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        let file = null;
        let url = null;
        let text = '';

        function load(selectedFile) {
            if (!selectedFile) {
                return;
            }

            file = selectedFile;

            if (url) {
                URL.revokeObjectURL(url);
            }

            url = URL.createObjectURL(file);
            $('meta').textContent =
                `${file.name} · ${file.type || 'unknown MIME'} · ${file.size.toLocaleString()} bytes`;

            file.text()
                .then((contents) => {
                    text = contents;
                    $('out').textContent = contents;
                })
                .catch(() => {
                    $('out').textContent =
                        'This appears to be a binary file. Use Download or Open Viewer if your browser supports its format.';
                });

            $('bar').classList.add('show');
        }

        $('drop').onclick = () => $('file').click();

        $('file').onchange = (event) => {
            load(event.target.files[0]);
        };

        $('download').onclick = () => {
            if (!url) {
                return;
            }

            const link = document.createElement('a');
            link.href = url;
            link.download = file.name;
            link.click();
        };

        $('copy').onclick = () => {
            navigator.clipboard?.writeText(text);
        };

        $('open').onclick = () => {
            if (url) {
                window.open(url, '_blank');
            }
        };

        $('hash').onclick = async () => {
            if (!file) {
                return;
            }

            const buffer = await crypto.subtle.digest(
                'SHA-256',
                await file.arrayBuffer()
            );

            const hash = [...new Uint8Array(buffer)]
                .map((byte) => byte.toString(16).padStart(2, '0'))
                .join('');

            $('meta').textContent += ` · SHA-256: ${hash}`;
        };

        $('clear').onclick = () => {
            if (url) {
                URL.revokeObjectURL(url);
            }

            file = null;
            url = null;
            text = '';
            $('file').value = '';
            $('meta').textContent = '';
            $('out').textContent = 'No file loaded.';
            $('bar').classList.remove('show');
        };

        ['dragover', 'dragenter'].forEach((eventName) => {
            $('drop').addEventListener(eventName, (event) => {
                event.preventDefault();
            });
        });

        $('drop').ondrop = (event) => {
            event.preventDefault();
            load(event.dataTransfer.files[0]);
        };
    </script>
</body>
</html>
