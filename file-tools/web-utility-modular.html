<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Web Utility</title><style>:root{--bg:#f5f7fb;--p:#fff;--s:#edf2f7;--t:#17212b;--m:#66737f;--b:#cfd8e3;--a:#2563eb;--a2:#1d4ed8;--sh:0 7px 24px #0001}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fffffff5;backdrop-filter:blur(10px);border-bottom:1px solid var(--b);padding:14px 20px;box-shadow:0 2px 12px #0001}.topline{display:flex;gap:16px;align-items:center}.top h1{margin:0;font-size:25px}.sub{color:var(--m);font-size:13px}.toolbar{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--b);background:var(--p);color:var(--t);padding:8px 12px;border-radius:9px}.btn:hover{border-color:var(--a);background:var(--s)}.primary{background:var(--a);border-color:var(--a);color:#fff}.primary:hover{background:var(--a2)}main{max-width:1450px;margin:18px auto;padding:0 15px}.search{width:100%;max-width:900px;margin:0 auto 15px;display:block;padding:12px 14px;font-size:16px}input,select,textarea{width:100%;padding:9px 10px;background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:9px;outline:none;margin:5px 0}input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px #2563eb18}label{display:block;font-size:12px;color:var(--m);margin:7px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:100px}.category{margin-bottom:18px}.categoryHead{font-weight:800;font-size:18px;padding:5px 2px 9px;display:flex;gap:8px}.categoryCount{font-size:12px;padding:2px 7px;border-radius:99px;background:var(--s);color:var(--m)}.toolGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.section{background:var(--p);border:1px solid var(--b);border-radius:14px;box-shadow:var(--sh);overflow:hidden}.head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--s);border-bottom:1px solid var(--b)}.ico{width:28px;text-align:center;font-size:20px}.titleWrap{flex:1;min-width:0}.title{font-weight:750;display:block}.desc{display:block;color:var(--m);font-size:12px}.collapse{width:38px;padding:5px;flex:none}.collapse:after{content:'−';font-size:18px}.min .collapse:after{content:'+'}.body{padding:14px}.min .body{display:none}.result{margin-top:10px;padding:11px;background:var(--s);border:1px solid var(--b);border-radius:9px;white-space:pre-wrap;overflow:auto;min-height:42px}.mono,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.preview{width:100%;height:230px;border:1px solid var(--b);border-radius:9px;background:#fff}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bigResult{text-align:center;font:700 32px ui-monospace,monospace;padding:15px;background:var(--s);border-radius:10px}.symbolGrid{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.symbol{font-size:22px;padding:7px 11px;border:1px solid var(--b);background:var(--p);border-radius:9px}.notice{position:fixed;right:18px;bottom:18px;padding:10px 14px;border-radius:10px;background:#17212b;color:#fff;opacity:0;transform:translateY(8px);transition:.2s;z-index:50;pointer-events:none}.notice.show{opacity:1;transform:none}.notice[data-type=error]{background:#b42318}.offline{display:inline-block;margin-left:8px;font-size:11px;border:1px solid var(--b);border-radius:99px;padding:2px 7px;color:var(--m);vertical-align:middle}@media(max-width:800px){.toolGrid,.twocol{grid-template-columns:1fr}.topline{align-items:flex-start;flex-wrap:wrap}.toolbar{margin-left:0}}</style></head><body><header class="top"><div class="topline"><div><h1>Web Utility <span class="offline">offline-first</span></h1><div class="sub">A modular everyday and web-development utility collection.</div></div><div cl
