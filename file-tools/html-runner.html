<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local HTML Runner</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #111827;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 10px 14px;
            background: #1f2937;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 12px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }

        #drop {
            margin: auto;
            padding: 40px;
            border: 2px dashed #818cf8;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
        }

        iframe {
            display: none;
            flex: 1;
            width: 100%;
            border: 0;
        }

        input {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <b>HTML Runner</b>
        <button id="pick">Open HTML</button>
        <button id="blob">Blob Runner</button>
        <button id="blank">about:blank Runner</button>
        <button id="safe">Sandbox Runner</button>
        <button id="clear">Clear</button>
        <span id="status">No file</span>
    </header>

    <div id="drop">
        Drop an HTML file here<br>
        <small>Execution stays in the browser.</small>
        <input id="file" type="file" accept=".html,.htm,text/html">
    </div>

    <iframe id="frame"></iframe>

    <script>
        const $ = (id) => document.getElementById(id);
        let file = null;
        let url = null;

        function load(selectedFile) {
            if (!selectedFile) {
                return;
            }

            if (url) {
                URL.revokeObjectURL(url);
            }

            file = selectedFile;
            url = URL.createObjectURL(file);
            $('drop').style.display = 'none';
            $('status').textContent = file.name;
        }

        function needFile() {
            if (!file) {
                alert('Open an HTML file first.');
                return false;
            }

            return true;
        }

        function blobRunner() {
            if (!needFile()) {
                return;
            }

            if (!window.open(url, '_blank')) {
                alert('Popup blocked.');
            }
        }

        function aboutBlankRunner() {
            if (!needFile()) {
                return;
            }

            const windowRef = window.open('about:blank', '_blank');

            if (!windowRef) {
                alert('Popup blocked.');
                return;
            }

            windowRef.document.open();
            windowRef.document.write(`
                <!doctype html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <title>${file.name.replace(/[<>]/g, '')}</title>
                </head>
                <body style="margin:0">
                    <iframe
                        id="runner"
                        style="border:0;width:100vw;height:100vh"
                        src="${url}"
                    ></iframe>
                </body>
                </html>
            `);
            windowRef.document.close();
        }

        function sandboxRunner() {
            if (!needFile()) {
                return;
            }

            const frame = $('frame');
            frame.sandbox =
                'allow-scripts allow-forms allow-modals allow-popups allow-downloads';
            frame.src = url;
            frame.style.display = 'block';
        }

        $('pick').onclick = () => $('file').click();

        $('file').onchange = (event) => {
            load(event.target.files[0]);
        };

        $('drop').onclick = () => $('file').click();
        $('blob').onclick = blobRunner;
        $('blank').onclick = aboutBlankRunner;
        $('safe').onclick = sandboxRunner;

        $('clear').onclick = () => {
            if (url) {
                URL.revokeObjectURL(url);
            }

            file = null;
            url = null;
            $('frame').removeAttribute('src');
            $('frame').style.display = 'none';
            $('file').value = '';
            $('drop').style.display = 'block';
            $('status').textContent = 'No file';
        };

        ['dragover', 'dragenter'].forEach((eventName) => {
            $('drop').addEventListener(eventName, (event) => {
                event.preventDefault();
            });
        });

        $('drop').ondrop = (event) => {
            event.preventDefault();
            load(event.dataTransfer.files[0]);
        };
    </script>
</body>
</html>
