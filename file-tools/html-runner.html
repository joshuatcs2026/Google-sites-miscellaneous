<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local HTML Runner</title><style>body{margin:0;font-family:system-ui;background:#111827;color:#fff;height:100vh;display:flex;flex-direction:column}header{padding:10px 14px;background:#1f2937;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:8px 12px;border:0;border-radius:7px;cursor:pointer}#drop{margin:auto;padding:40px;border:2px dashed #818cf8;border-radius:14px;text-align:center;cursor:pointer}iframe{display:none;flex:1;width:100%;border:0}input{display:none}</style></head><body><header><b>HTML Runner</b><button id="pick">Open HTML</button><button id="blob">Blob Runner</button><button id="blank">about:blank Runner</button><button id="safe">Sandbox Runner</button><button id="clear">Clear</button><span id="status">No file</span></header><div id="drop">Drop an HTML file here<br><small>Execution stays in the browser.</small><input id="file" type="file" accept=".html,.htm,text/html"></div><iframe id="frame"></iframe><script>const $=x=>document.getElementById(x);let f=null,u=null;function load(x){if(!x)return;if(u)URL.revokeObjectURL(u);f=x;u=URL.createObjectURL(f);$('drop').style.display='none';$('status').textContent=f.name}function need(){if(!f)return alert('Open an HTML file first.');return true}function blob(){if(!need())return;window.open(u,'_blank')||alert('Popup blocked.')}function blank(){if(!need())return;const w=window.open('about:blank','_blank');if(!w)return alert('Popup blocked.');w.document.open();w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+f.name.replace(/[<>]/g,'')+'</title></head><body style="margin:0"><iframe id="x" style="border:0;width:100vw;height:100vh" src="'+u+'"></iframe></body></html>');w.document.close()}function safe(){if(!need())return;$('frame').sandbox='allow-scripts allow-forms allow-modals allow-popups allow-downloads';$('frame').src=u;$('frame').style.display='block'}$('pick').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);$('drop').onclick=()=>$('file').click();$('blob').onclick=blob;$('blank').onclick=blank;$('safe').onclick=safe;$('clear').onclick=()=>{if(u)URL.revokeObjectURL(u);f=null;u=null;$('frame').removeAttribute('src');$('frame').style.display='none';$('file').value='';$('drop').style.display='block';$('status').textContent='No file'};['dragover','dragenter'].forEach(x=>$('drop').addEventListener(x,e=>e.preventDefault()));$('drop').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])}</script></body></html>
